target-version = "py39"
line-length = 100
exclude = ["analysis/outputs"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PLW",  # pylint warnings
    "ISC",  # implicit string concatenation
    "DTZ",  # datetime timezone
    "TRY",  # tryceratops
    "PERF", # perflint
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "C4",   # flake8-comprehensions
]
ignore = [
    # The harness raises one error type with a self-describing message at each
    # evidence boundary; a custom class per message would obscure that contract.
    "TRY003",
    # Handlers attach partial evidence to the exception before re-raising it.
    "TRY301",
]

[lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]  # test doubles keep callback signatures
"sensitivity/test_*.py" = ["ARG001", "ARG005"]  # fake analyzer keeps callback signatures
"analysis/analyze.py" = ["E501"]  # frozen historical analyzer; formatting is out of scope
