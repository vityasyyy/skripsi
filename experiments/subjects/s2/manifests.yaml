# Subject S2 (exp-s2): S1 + StatefulSet (1 replica) + PVC.
# Total 7 resources: 5 warisan S1 + StatefulSet exp-store + PVC exp-store-data.
# Namespace placeholder: ganti string EXP_NS dengan salah satu dari
#   exp-s2-manual | exp-s2-gitops  (Lingkungan A / B untuk S2)
# Contoh:
#   sed 's/EXP_NS/exp-s2-manual/g' manifests.yaml | kubectl apply --dry-run=client -f -
# Baseline S1 identik dengan subjects/s1 (replicas=3, nginx:1.25.3,
# LOG_LEVEL=info, password=ZXhwLXNlY3JldC0xMjM=).
# Baseline tambahan S2: StatefulSet exp-store replicas=1, image nginx:1.25.3.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: exp-web-config
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s2
data:
  LOG_LEVEL: "info"
  DATABASE_URL: "postgres://db:5432/app"
  APP_NAME: "exp-web"
---
apiVersion: v1
kind: Secret
metadata:
  name: exp-web-secret
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s2
type: Opaque
data:
  username: ZXhwLXVzZXI=
  password: ZXhwLXNlY3JldC0xMjM=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp-web
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: exp-web
  template:
    metadata:
      labels:
        app: exp-web
        subject: s2
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.3
          ports:
            - containerPort: 80
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: exp-web-config
                  key: LOG_LEVEL
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: exp-web-config
                  key: APP_NAME
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: exp-web-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exp-web
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s2
spec:
  selector:
    app: exp-web
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: exp-web-tick
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s2
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: exp-web-tick
            subject: s2
        spec:
          restartPolicy: OnFailure
          containers:
            - name: tick
              image: busybox:1.36
              command: ["sh", "-c", "echo tick $(date -u +%FT%TZ)"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exp-store-data
  namespace: EXP_NS
  labels:
    app: exp-store
    subject: s2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: exp-store
  namespace: EXP_NS
  labels:
    app: exp-store
    subject: s2
spec:
  serviceName: exp-web
  replicas: 1
  selector:
    matchLabels:
      app: exp-store
  template:
    metadata:
      labels:
        app: exp-store
        subject: s2
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: exp-store-data
