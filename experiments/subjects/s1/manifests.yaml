# Subject S1 (exp-s1): surrogate minimal untuk kelas workload komposit multi-service.
# 5 resources: Deployment + Service + ConfigMap + Secret + CronJob.
# Namespace placeholder: ganti string EXP_NS dengan salah satu dari
#   exp-s1-manual | exp-s1-gitops  (Lingkungan A / B untuk S1)
# Contoh:
#   sed 's/EXP_NS/exp-s1-manual/g' manifests.yaml | kubectl apply --dry-run=client -f -
# Baseline (jangan diubah tanpa update drift-inject.sh + recovery-runbook.sh):
#   replicas=3, image=nginx:1.25.3, ConfigMap LOG_LEVEL=info,
#   Secret password=ZXhwLXNlY3JldC0xMjM= (exp-secret-123)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: exp-web-config
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s1
data:
  LOG_LEVEL: "info"
  DATABASE_URL: "postgres://db:5432/app"
  APP_NAME: "exp-web"
---
apiVersion: v1
kind: Secret
metadata:
  name: exp-web-secret
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s1
type: Opaque
data:
  username: ZXhwLXVzZXI=
  password: ZXhwLXNlY3JldC0xMjM=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp-web
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: exp-web
  template:
    metadata:
      labels:
        app: exp-web
        subject: s1
    spec:
      containers:
        - name: nginx
          image: nginx:1.25.3
          ports:
            - containerPort: 80
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: exp-web-config
                  key: LOG_LEVEL
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: exp-web-config
                  key: APP_NAME
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: exp-web-secret
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exp-web
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s1
spec:
  selector:
    app: exp-web
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: exp-web-tick
  namespace: EXP_NS
  labels:
    app: exp-web
    subject: s1
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: exp-web-tick
            subject: s1
        spec:
          restartPolicy: OnFailure
          containers:
            - name: tick
              image: busybox:1.36
              command: ["sh", "-c", "echo tick $(date -u +%FT%TZ)"]
