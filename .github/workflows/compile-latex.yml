name: Compile LaTeX

on:
  push:
    branches: [ main, master ]
    paths:
      - 'content/proposal/**'
      - 'docker/Dockerfile'
      - '.github/workflows/compile-latex.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'content/proposal/**'
      - 'docker/Dockerfile'
      - '.github/workflows/compile-latex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-proposal:
    runs-on: ubuntu-latest
    name: Compile Proposal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile proposal with Docker
        run: make proposal-docker

      - name: Upload proposal PDF
        uses: actions/upload-artifact@v4
        with:
          name: proposal-pdf
          path: content/proposal/main.pdf
          retention-days: 90

  release-proposal:
    needs: compile-proposal
    runs-on: ubuntu-latest
    name: Create Proposal Release
    if: github.event_name == 'push'
    steps:
      - name: Download proposal PDF
        uses: actions/download-artifact@v4
        with:
          name: proposal-pdf

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proposal-v${{ github.run_number }}
          name: Proposal PDF #${{ github.run_number }}
          files: main.pdf

  compile-skripsi:
    runs-on: ubuntu-latest
    name: Compile Skripsi
    if: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile skripsi with Docker
        run: make skripsi-docker

      - name: Upload skripsi PDF
        uses: actions/upload-artifact@v4
        with:
          name: skripsi-pdf
          path: content/skripsi/main.pdf
          retention-days: 90