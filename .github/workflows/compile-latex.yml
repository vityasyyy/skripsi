name: Compile LaTeX

on:
  push:
    branches: [ main, master ]
    paths:
      - 'content/proposal/**'
      - 'content/skripsi/**'
      - 'presentation/proposal/**'
      - 'presentation/skripsi/**'
      - 'docker/Dockerfile'
      - '.github/workflows/compile-latex.yml'
      - 'Makefile'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'content/proposal/**'
      - 'content/skripsi/**'
      - 'presentation/proposal/**'
      - 'presentation/skripsi/**'
      - 'docker/Dockerfile'
      - '.github/workflows/compile-latex.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-proposal:
    runs-on: ubuntu-latest
    name: Compile Proposal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile proposal with Docker
        run: make proposal-docker

      - name: Upload proposal PDF
        uses: actions/upload-artifact@v4
        with:
          name: proposal-pdf
          path: content/proposal/main.pdf
          retention-days: 90

  compile-presentation:
    runs-on: ubuntu-latest
    name: Compile Presentation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile presentation with Docker
        run: make presentation-docker

      - name: Upload presentation PDF
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pdf
          path: presentation/proposal/build/main.pdf
          retention-days: 90

  compile-skripsi:
    runs-on: ubuntu-latest
    name: Compile Skripsi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile skripsi with Docker
        run: make skripsi-docker

      - name: Upload skripsi PDF
        uses: actions/upload-artifact@v4
        with:
          name: skripsi-pdf
          path: content/skripsi/main.pdf
          retention-days: 90

  compile-presentation-skripsi:
    runs-on: ubuntu-latest
    name: Compile Skripsi Presentation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile skripsi presentation with Docker
        run: make presentation-skripsi-docker

      - name: Upload skripsi presentation PDF
        uses: actions/upload-artifact@v4
        with:
          name: skripsi-presentation-pdf
          path: presentation/skripsi/build/main.pdf
          retention-days: 90

  release:
    needs:
      - compile-proposal
      - compile-skripsi
      - compile-presentation
      - compile-presentation-skripsi
    runs-on: ubuntu-latest
    name: Create Release
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download proposal PDF
        uses: actions/download-artifact@v4
        with:
          name: proposal-pdf
          path: proposal-artifact

      - name: Download skripsi PDF
        uses: actions/download-artifact@v4
        with:
          name: skripsi-pdf
          path: skripsi-artifact

      - name: Download proposal presentation PDF
        uses: actions/download-artifact@v4
        with:
          name: presentation-pdf
          path: proposal-presentation-artifact

      - name: Download skripsi presentation PDF
        uses: actions/download-artifact@v4
        with:
          name: skripsi-presentation-pdf
          path: skripsi-presentation-artifact

      - name: Rename PDFs for release
        run: |
          cp proposal-artifact/main.pdf proposal.pdf
          cp skripsi-artifact/main.pdf skripsi.pdf
          cp proposal-presentation-artifact/main.pdf proposal-presentation.pdf
          cp skripsi-presentation-artifact/main.pdf skripsi-presentation.pdf

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tugas-akhir-v${{ github.run_number }}
          name: Tugas Akhir
          fail_on_unmatched_files: true
          files: |
            proposal.pdf
            skripsi.pdf
            proposal-presentation.pdf
            skripsi-presentation.pdf
